[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LocalWhisper"
version = "0.1.0"
description = "A privacy-focused, local voice-to-text tool for macOS."
authors = [
    {name = "Gianni Rondini"},
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=0.9.0",
    "requests>=2.28.0",
    "pynput>=1.7.0",
    "pyaudio>=0.2.13",
    "pyperclip>=1.8.0",
]

[project.scripts]
localwhisper = "localwhisper.cli:main"

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "types-requests",
    "types-pyaudio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
