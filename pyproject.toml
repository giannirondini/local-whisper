[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LocalWhisper"
version = "1.0.0"
description = "A privacy-focused, local voice-to-text tool for macOS."
authors = [
    {name = "Gianni Rondini"},
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Single source of truth for runtime dependencies. There is no requirements.txt;
# `uv lock` pins exact versions in uv.lock.
dependencies = [
    "faster-whisper>=1.0.0",
    "numpy>=1.24",
    "requests>=2.28.0",
    "pynput>=1.7.0",
    "pyaudio>=0.2.13",
    "pyperclip>=1.8.0",
]

[project.scripts]
localwhisper = "localwhisper.cli:main"
localwhisper-gui = "localwhisper.gui.menubar:main"

# `uv sync --extra gui` (or `pip install -e ".[gui]"`) adds the menu bar app.
[project.optional-dependencies]
gui = [
    "pyobjc-framework-cocoa>=10",
    "rumps>=0.4",
]

# PEP 735 dependency groups: `uv sync` installs `dev` by default;
# `pip install -e . --group dev` does the same with pip >= 25.1.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "types-pyaudio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff also formats Python fences in Markdown; docs snippets are illustrative, leave them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
